<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Opening Hermes…</title>
<style>body{font:16px/1.55 -apple-system,system-ui,sans-serif;max-width:560px;margin:3rem auto;padding:0 1.2rem;color:#222}a.btn{display:inline-block;padding:.6rem 1rem;border-radius:8px;background:#222;color:#fff;text-decoration:none}@media(prefers-color-scheme:dark){body{background:#111;color:#ddd}a.btn{background:#ddd;color:#111}}</style></head>
<body><h1 id="h">Opening the chat in Hermes…</h1>
<p id="p">If nothing happens, click the button. It only works on a computer with the Hermes app installed.</p>
<p><a class="btn" id="go" href="#">Open in Hermes</a></p>
<script>
// Only Hermes session IDs are accepted, so this page can't be used to redirect anywhere else.
var s = new URLSearchParams(location.search).get('s') || '';
if (/^(\d{8}_\d{6}_[0-9a-f]{6})$/.test(s)) {
  var u = 'hermes://open/' + s;
  document.getElementById('go').href = u;
  location.href = u;
} else {
  document.getElementById('h').textContent = 'That link is not a Hermes chat link.';
  document.getElementById('p').textContent = '';
  document.getElementById('go').style.display = 'none';
}
</script></body></html>
